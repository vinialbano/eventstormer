name: release

# Standing version PR on main (ADR-009). Merging it is the release:
# `changeset version` bumps package.json and regenerates CHANGELOG.md, then
# the tag + GitHub Release. `publish` is not wired — unpublished app.
#
# The action's default commit/title is "Version Packages", which commitlint
# and the PR-title check both reject. The message must be conventional.
# `pnpm install` runs `prepare` → lefthook install; LEFTHOOK=0 keeps those
# hooks from firing on the action's `git commit` / `git push`.
#
# Workflow `permissions` are not enough: the repo must also have
# Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests" enabled (`can_approve_pull_request_reviews`).

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          # changelog-github resolves each changeset to a PR via git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
