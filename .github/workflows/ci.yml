name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one Node version, fail fast. Typecheck is cheapest and catches
  # most, so it runs first. This mirrors `pnpm check` exactly — CI and the
  # pre-push hook must never be able to disagree about what "green" means.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: architecture
        run: pnpm depcruise

      - name: dead code
        run: pnpm knip
