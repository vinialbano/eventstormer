name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tightest default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # PR title, not commits — a squash-merge turns the title into the commit
  # message, and commitlint already covers individual commits locally.
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every delivery declares its version impact (ADR-009). A PR that touches
  # src/** must add a .changeset/*.md, or this fails with a clear fix message.
  # Bootstrap: no-op until the first release exists (CHANGELOG.md absent) so it
  # is green on the Slice 0 PR and enforces from Slice 1 onward.
  changeset-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: require a changeset for src/** changes
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md yet — pre-first-release bootstrap. Changeset guard is inert."
            exit 0
          fi
          range="origin/${{ github.base_ref }}...HEAD"
          if git diff --name-only "$range" | grep -qE '^src/'; then
            added_changeset="$(git diff --name-only --diff-filter=A "$range" \
              | grep -E '^\.changeset/[^/]+\.md$' | grep -v '^\.changeset/README\.md$' || true)"
            if [ -z "$added_changeset" ]; then
              echo "::error::This PR changes src/** but adds no .changeset/*.md. Run 'pnpm changeset', pick the bump, and commit the file."
              exit 1
            fi
          fi
          echo "changeset guard: ok"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This repo exists because a hand-written doc drifts from the model it
  # describes. The docs here must not drift from each other: offline mode
  # resolves every relative link across the project's own Markdown and fails on
  # a dangling one — the exact breakage a file move or rename leaves behind.
  # External URLs are not checked (someone else's server being down is not our
  # build failing); `.claude/` and `.specs/` are vendored / historical.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            'AGENTS.md' 'ARCHITECTURE.md' 'PRODUCT.md' 'README.md' 'CLAUDE.md'
            'docs/**/*.md' '.changeset/README.md'
          failIfEmpty: true

  # Steps through knip match `pnpm check` / leftover (process-ids first).
  # `build` is CI-only and sits after that, out of the Stop hook.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` — pnpm/action-setup reads `packageManager` from
      # package.json via Corepack, so the pin has exactly one home. Pinning
      # it again here is the drift eventos has (11 literal copies of a
      # version that isn't cross-checked against the manifest anywhere).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: process-ids
        run: pnpm check:process-ids

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: architecture
        run: pnpm depcruise

      - name: dead code
        run: pnpm knip

      # Not part of `pnpm check` / the Stop hook — that gate stays fast for
      # per-edit and per-stop use. CI is the one place a broken production
      # build (a Rolldown-specific import failure, a plugin misconfiguration)
      # gets caught before it reaches a reviewer.
      - name: build
        run: pnpm build

      # Also outside `pnpm check` for speed, same rationale as build. The hard
      # floor is `**/domain/** ≥ 90%` (ADR-008); the local ratchet in
      # vite.config is disabled here so CI measures against the committed
      # numbers, never a number it just raised itself. `--project` keeps the
      # eval project out of CI (ADR-008).
      - name: coverage
        run: pnpm exec vitest run --project domain --project app --coverage --coverage.thresholds.autoUpdate=false

  # Capture-loop Playwright spec. Not part of `pnpm check` / pre-push — those
  # stay fast. Env (scripted facilitator, empty ANTHROPIC_API_KEY, throwaway
  # DATA_DIR) comes from playwright.config.ts, not CI secrets.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: test:e2e
        run: pnpm test:e2e
